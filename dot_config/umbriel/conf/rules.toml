[keybinds]
# Profile 0 (default-release)
"Mod+B" = 'spawn:uwsm-app -- firefox --name firefox-p0 -P "jeremy"'
"Mod+Alt+B" = 'spawn:uwsm-app -- firefox --name firefox-p1 -P "issou"'
"Mod+Shift+B" = 'spawn:uwsm-app -- firefox --name firefox-p2 -P "loreal"'
"Mod+Shift+Alt+B" = 'spawn:uwsm-app -- firefox --name firefox-p3 -P "ric"'

[[window_rule]]
match.app_id = ["^firefox-p0$", "^firefox-p1$"]
default_workspace = 1
default_focused = false

# Profile 2 → workspace 2
[[window_rule]]
match.app_id = "^firefox-p2$"
default_workspace = 2
